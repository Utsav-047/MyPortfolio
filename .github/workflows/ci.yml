name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm install

      - name: Run ESLint Code Quality Checks
        run: npm run lint

  build-and-test:
    name: Automated Testing & Build
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend & Backend Dependencies
        run: |
          npm install
          cd backend && npm install

      - name: Execute Automated Test Suite (Jest & Supertest)
        env:
          NODE_ENV: test
          JWT_SECRET: utsav_myportfolio_super_secure_jwt_secret_2026
          PORT: 5000
        run: |
          cd backend
          npm test

      - name: Build Production Bundle (Vite)
        run: npm run build

      - name: Report CI/CD Status Summary
        run: |
          echo "===================================================="
          echo "✅ CI/CD Pipeline Executed Successfully!"
          echo "All linting checks passed."
          echo "Automated Jest & Supertest test cases passed (6/6)."
          echo "Frontend production distribution bundle verified."
          echo "===================================================="
