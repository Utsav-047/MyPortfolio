# ==============================================================================
# Docker Compose: Multi-Container Full-Stack Orchestration
# ==============================================================================
# Services:
#   1. frontend: Multi-stage React/Vite built & served by Nginx (Port 3000 -> 80)
#   2. backend:  Node.js Express REST API server with healthcheck (Port 5000)
#   3. mongo:    MongoDB 7.0 database with persistent volume (Port 27017)
# ==============================================================================

version: '3.8'

services:
  # ── 1. Frontend Web Client (React + Nginx) ─────────────────────────────────
  frontend:
    container_name: portfolio-frontend
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_started
    networks:
      - portfolio-network
    restart: unless-stopped

  # ── 2. Backend API Service (Node.js Express) ───────────────────────────────
  backend:
    container_name: portfolio-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/portfolio_db
      - JWT_SECRET=portfolio_super_secure_jwt_secret_key_docker_2026
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - portfolio-network
    restart: unless-stopped

  # ── 3. Database Service (MongoDB 7.0) ──────────────────────────────────────
  mongo:
    container_name: portfolio-mongo
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - portfolio-network
    restart: always
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# ── Persistent Storage Volumes ────────────────────────────────────────────────
volumes:
  mongo-data:
    name: portfolio_mongo_data
    driver: local

# ── Isolated Internal Bridge Network ──────────────────────────────────────────
networks:
  portfolio-network:
    name: portfolio_bridge_network
    driver: bridge
